<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/dehat-icon-32.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/dehat-icon-180.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F1E3" />

    <title>Dehat Sweets and Foods — Handcrafted Afghan Sweets &amp; Specialty Foods</title>
    <meta
      name="description"
      content="Handcrafted Afghan sweets and specialty foods in the Sacramento area — cream rolls, root, malida, khajoor, torshi, and chatni. Order for your family, your event, or your store."
    />
    <meta property="og:site_name" content="Dehat Sweets and Foods" />
    <meta property="og:title" content="Dehat Sweets and Foods — Handcrafted Afghan Sweets &amp; Specialty Foods" />
    <meta
      property="og:description"
      content="Handcrafted Afghan sweets and specialty foods inspired by the flavors, hospitality, and memories of Afghanistan."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.dehatsweets.com/" />
    <meta property="og:image" content="https://www.dehatsweets.com/img/hero-1280.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://www.dehatsweets.com/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Preload the hero image for fast LCP on the homepage -->
    <link
      rel="preload"
      as="image"
      href="/img/hero-1280.webp"
      imagesrcset="/img/hero-768.webp 768w, /img/hero-1280.webp 1280w, /img/hero-lg.webp 1536w"
      imagesizes="100vw"
    />

    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
